# NekoCore 1.3.1 · Momo Land 清新柔彩主题
config-version: 7
database:
  filename: nekocore.db
  save-interval-seconds: 30
survival:
  world: world
  # 普通世界入口，交给 Multiverse 前往该世界公共出生点。
  command: 'mvtp {player} {world}'
survival-new:
  world: world_new
  command: 'mvtp {player} {world}'
home:
  bed-auto-set:
    enabled: true
    # 成功躺下后，在床边寻找安全站立位置；不改原版重生点或睡眠机制。
    # 世界名区分大小写。列表为空或 enabled: false 时不自动设置。
    worlds: [world, world_new]
minigames:
  world: lobby
  x: 27.5
  y: 53.0
  z: 21.5
  yaw: 0.0
  pitch: 0.0
location-prefix:
  enabled: true
  # 管理员自行放置 GeoLite2-City.mmdb；JAR 不附带任何 GeoIP 数据库。
  database-file: GeoLite2-City.mmdb
  cache-session: true
  show-china-province: true
  show-foreign-country: true
  hide-unknown: true
afk-pool:
  enabled: true
  # lobby 中唯一水体即挂机池；无需 WorldGuard 区域。
  world: lobby
  teleport:
    x: -10.5
    y: 54.0
    z: 33.5
    yaw: 180.0
    pitch: 0.0
  exit-grace-seconds: 3
  reward:
    interval-seconds: 300
    base-exp: 10
    normal-multiplier: 1.10
    coin-chance: 0.45
    coin-min: 1
    coin-max: 4
  title:
    enabled: true
    hide-while-inventory-open: true
    # 停止刷新后约 2.5 秒内自然淡出，不主动 clearTitle。
    stay-ticks: 40
    fade-out-ticks: 10
tab:
  enabled: true
  # 只控制全局 TAB 玩家列表；聊天仍由玩家自己的“显示网络地区”隐私开关决定。
  show-location-prefix: true
  # 全服共用一个刷新任务；数值来自 Paper 和 NekoCore 内存缓存，不查询数据库。
  refresh-seconds: 1
leveling:
  # 当前 L 级升到下一级：base + linear*(L-1) + quadratic*(L-1)^2
  base: 100
  linear: 50
  quadratic: 0
  max-level: 10000
cleanup:
  enabled: true
  interval-seconds: 600
  sound:
    enabled: true
    name: minecraft:block.note_block.pling
    volume: 0.6
    pitch: 1.6
tips:
  enabled: true
  interval-seconds: 300
  prefix: '&#9FD9F6tips &f>> '
  # 每轮只播报一条，末尾后回到第一条。重载后从第一条重新计时。
  messages:
    - '&f输入 &#9FD9F6/spawn &f返回主城，冒险累了就回来歇一会儿。'
    - '&f输入 &#9FD9F6/menu &f打开服务器面板，挑一个想去的地方吧。'
    - '&f睡床或用 &#9FD9F6/sethome &f记下小窝，&#9FD9F6/home world &f能回生存一区。'
    - '&f生存二区的小窝也单独保存，输入 &#9FD9F6/home world_new &f就能回来。'
    - '&f输入 &#9FD9F6/check home world &f看看小窝的坐标。'
    - '&f输入 &#9FD9F6/checkin &f领取今天的小礼物，慢慢积攒冒险金币。'
    - '&f输入 &#9FD9F6/coins &f看看小金库，今天又存了多少呢？'
    - '&f缺一点材料？输入 &#9FD9F6/store &f逛逛商店，右键买入、左键出售。'
    - '&f输入 &#9FD9F6/bag &f查看随身物品；在两个生存世界可以取放，大厅只读。'
    - '&f想和朋友汇合？输入 &#9FD9F6/tpn <玩家名> &f送出一个传送请求。'
    - '&f收到传送请求时，输入 &#B6E3D0/yes &f让朋友来到你身边。'
    - '&f暂时不方便汇合？输入 &#EDB9CE/no &f就能婉拒传送请求。'
    - '&f想休息一下？&#9FD9F6/menu &f里可以去挂机池坐一会儿～'
    - '&f主城挂机池会慢慢积累一点 EXP，还有机会捞到小金币哦。'
    - '&f打开 &#9FD9F6/menu &f看看今日任务，简单、普通、困难各有三份小目标。'
checkin:
  enabled: true
  # 每个自然日一次，不是每隔 24 小时；在线跨日无需重进。
  timezone: Asia/Shanghai
  coins: 100
  exp: 50
  sound:
    name: minecraft:block.amethyst_block.chime
    volume: 0.6
    pitch: 1.4
  # 仅向签到者显示少量白色 END_ROD 粒子；0 可关闭。
  particle-count: 16
chat:
  # 已有聊天插件使用 %nekocore_display_prefix% 时改为 false，避免重复。
  level-prefix-enabled: true
  level-prefix: '&#9FD9F6[&fLv.{level}&#9FD9F6] &r'
gui:
  title: '&#9FD9F6Momo Land &7· &#9FD9F6服务器面板'
  rows: 5
  filler:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: ' '
  items:
    profile:
      slot: 10
      material: PLAYER_HEAD
      name: '&#9FD9F6玩家资料 &7· &f{player}'
      lore:
        - '&#B2C3CF等级 &f{level} &7· &#B2C3CF经验 &f{exp}/{exp_needed}'
        - '&#B2C3CF金币 &f{coins}'
        - '&#B2C3CF游玩时长 &f{playtime}'
        - ''
        - '&#C5E9FA点击看看自己的冒险足迹'
    daily:
      slot: 12
      material: BOOK
      name: '&#C5E9FA每日任务'
      lore: ['&#B2C3CF简单、普通、困难各 3 个', '&#C5E9FA北京时间 00:00 换一套', '', '&f点击查看今日任务']
    checkin:
      slot: 14
      material: SUNFLOWER
      name: '&#9FD9F6每日签到'
      lore:
        - '&#B2C3CF今日状态：{checkin_status}'
        - '&#B2C3CF小礼物：&#FFE49A{checkin_coins} 金币 &7+ &#FFE49A{checkin_exp} 经验'
        - ''
        - '&#C5E9FA每天见一面，成长多一点喵~'
    privacy:
      slot: 16
      material: NAME_TAG
      name: '&#C5E9FA显示网络地区'
      lore: ['&#B2C3CF你的选择：{show_ip}', '&#C5E9FA点击切换个人隐私偏好', '&#B2C3CF只显示省份或国家，不公开完整 IP']
    survival:
      slot: 28
      material: GRASS_BLOCK
      name: '&#9FD9F6生存一区'
      lore: ['&#B2C3CF世界 &f{world}', '&#C5E9FA前往生存一区公共出生点', '&#B2C3CF回小窝可用 &f/home {world}', '', '&f点击前往']
    survival-new:
      slot: 30
      material: CHERRY_SAPLING
      name: '&#C5E9FA生存二区'
      lore: ['&#B2C3CF世界 &f{world_new}', '&#C5E9FA前往生存二区公共出生点', '&#B2C3CF回小窝可用 &f/home {world_new}', '', '&f点击前往']
    minigames:
      slot: 32
      material: SLIME_BALL
      name: '&#9FD9F6小游戏区'
      lore: ['&#B2C3CF主城里的轻松时光', '&#C5E9FA和朋友一起玩一会儿喵~', '', '&f点击前往']
    afk-pool:
      slot: 34
      material: WATER_BUCKET
      name: '&#C5E9FA挂机池'
      lore: ['&#B2C3CF主城里安静的小水池', '&#C5E9FA每隔一会儿收下一点 EXP', '&#B2C3CF偶尔还能捞到几枚金币 ✦', '', '&f点击前往']

# 全服每天共用同一轮任务，玩家进度各自保存。稳定 task ID 不应随显示名修改。
daily-tasks:
  enabled: true
  timezone: Asia/Shanghai
  draw-count: {easy: 3, normal: 3, hard: 3}
  # 一天全清默认共 345 金币 / 240 EXP；明显有梯度，但不会代替主要经济玩法。
  rewards:
    easy: {coins: 20, exp: 15}
    normal: {coins: 35, exp: 25}
    hard: {coins: 60, exp: 40}
  pools:
    easy: [simple_gardener, simple_healthy, simple_shear_sheep, simple_good_morning, simple_crafting, simple_eat_food, simple_pastoral]
    normal: [normal_harvest, normal_dessert, normal_tax_collector, normal_cleanup, normal_deepslate_worker, normal_smelt, normal_blacksmith, normal_fishing]
    hard: [hard_enchant, hard_tycoon, hard_marksman, hard_mlg_water, hard_iron_golem]
  rules:
    simple_gardener:
      target: 16
      blocks: [OAK_LEAVES, SPRUCE_LEAVES, BIRCH_LEAVES, JUNGLE_LEAVES, ACACIA_LEAVES, DARK_OAK_LEAVES, MANGROVE_LEAVES, CHERRY_LEAVES, AZALEA_LEAVES, FLOWERING_AZALEA_LEAVES, PALE_OAK_LEAVES, SHORT_GRASS, TALL_GRASS, FERN, LARGE_FERN, DANDELION, POPPY, BLUE_ORCHID, ALLIUM, AZURE_BLUET, RED_TULIP, ORANGE_TULIP, WHITE_TULIP, PINK_TULIP, OXEYE_DAISY, CORNFLOWER, LILY_OF_THE_VALLEY, TORCHFLOWER, PITCHER_PLANT, WITHER_ROSE, SUNFLOWER, LILAC, ROSE_BUSH, PEONY]
    simple_healthy: {target: 1}
    simple_shear_sheep: {target: 1}
    simple_good_morning: {target-minutes: 20}
    simple_crafting: {target: 5}
    simple_eat_food: {target: 5}
    simple_pastoral:
      target: 8
      materials: [WHEAT_SEEDS, BEETROOT_SEEDS, PUMPKIN_SEEDS, MELON_SEEDS, CARROT, POTATO]
    normal_harvest:
      target: 24
      blocks: [WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART, COCOA]
    # 内部以 9 为目标；蛋糕/南瓜派一次补满，曲奇按真实产出累积。
    normal_dessert: {target: 9}
    normal_tax_collector: {target: 1}
    normal_cleanup: {target: 8}
    normal_deepslate_worker:
      target: 12
      blocks: [DEEPSLATE_COAL_ORE, DEEPSLATE_IRON_ORE, DEEPSLATE_COPPER_ORE, DEEPSLATE_GOLD_ORE, DEEPSLATE_REDSTONE_ORE, DEEPSLATE_LAPIS_ORE, DEEPSLATE_DIAMOND_ORE, DEEPSLATE_EMERALD_ORE]
    normal_smelt: {target: 16}
    normal_blacksmith:
      target: 3
      materials: [IRON_PICKAXE, IRON_AXE, IRON_SHOVEL, IRON_HOE]
    normal_fishing:
      target: 3
      materials: [COD, SALMON, PUFFERFISH, TROPICAL_FISH]
    hard_enchant: {target: 1}
    hard_tycoon: {target: 5}
    hard_marksman:
      target: 1
      # HAPPY_GHAST（乐魂）在代码和配置校验中都被永久排除；普通 GHAST 可计入。
      entities: [PHANTOM, GHAST, VEX, BEE, BAT, PARROT, ALLAY]
    hard_mlg_water: {target: 1, minimum-height: 16}
    hard_iron_golem: {target: 1}
  gui:
    filler: LIGHT_GRAY_STAINED_GLASS_PANE
    easy-filler: LIME_STAINED_GLASS_PANE
    normal-filler: LIGHT_BLUE_STAINED_GLASS_PANE
    hard-filler: PINK_STAINED_GLASS_PANE
    slots:
      easy: [10, 13, 16]
      normal: [19, 22, 25]
      hard: [28, 31, 34]
      back: 36
      info: 40
      close: 44
  feedback:
    sound: {name: 'minecraft:block.amethyst_block.chime', volume: 0.45, pitch: 1.65}
    particle-count: 10

# 头衔商店仅由管理员/控制台 /nekocore levelshop open <player> 打开。
# 最高已拥有档位提供权益；当前装备项只决定外观，不会丢失已购买的权益。
levelshop:
  enabled: true
  worlds: [lobby]
  permissions:
    auto-checkin: nekocore.perk.auto-checkin
    colored-chat: nekocore.perk.colored-chat
    fast-tpn: nekocore.perk.fast-tpn
  titles:
    mame:
      name: Yuki
      prefix: '&#B6E3D0[Yuki] &r'
      material: SNOWBALL
      slot: 11
      rank: 1
      price: 2500
      auto-checkin: true
      colored-chat: false
      tpn-cooldown-seconds: 120
      afk-exp-multiplier: 1.10
      description: ['&f像初雪一样轻盈', '&#B2C3CF上线自动签到', '&#B2C3CF传送冷却 120 秒 · 挂机 EXP ×1.10']
    momo:
      name: Momo
      prefix: '&#EDB9CE[Momo] &r'
      material: PINK_PETALS
      slot: 13
      rank: 2
      price: 7500
      auto-checkin: true
      colored-chat: true
      tpn-cooldown-seconds: 60
      afk-exp-multiplier: 1.10
      description: ['&f桃色的冒险时光', '&#B2C3CF自动签到 · 安全聊天颜色', '&#B2C3CF传送冷却 60 秒 · 挂机 EXP ×1.10']
    sora:
      name: Neko
      prefix: '&#CBBFEF[Neko] &r'
      material: HEART_OF_THE_SEA
      slot: 15
      rank: 3
      price: 20000
      auto-checkin: true
      colored-chat: true
      tpn-cooldown-seconds: 30
      afk-exp-multiplier: 1.20
      description: ['&f猫猫守护着这段旅程', '&#B2C3CF自动签到 · 安全聊天颜色', '&#B2C3CF传送冷却 30 秒 · 挂机 EXP ×1.20']
nametag:
  enabled: true
  # 只检查 scoreboard 是否被其他插件替换，不访问数据库；不抢占其他插件的 team。
  scoreboard-check-seconds: 5
bag:
  enabled: true
  # 白名单外全部只读，包括大厅和今后新增的世界。
  writable-worlds: [world, world_new]
  unlock-levels:
    '27': 10
    '36': 25
  readonly-notice-seconds: 4
tpn:
  enabled: true
  timeout-seconds: 60
  cooldown-seconds: 180
  fast-cooldown-seconds: 30
  sound: {name: 'minecraft:block.amethyst_block.chime', volume: 0.6, pitch: 1.5}
  particle-count: 12
store:
  enabled: true
  category-rows: 4
  default-sell-limit: 200
  sell-price: {numerator: 2, denominator: 3}
  input-timeout-seconds: 30
  maximum-custom-quantity: 1000000
